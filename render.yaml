services:
  - type: web
    name: phoenix-api
    runtime: node
    buildCommand: pnpm install && pnpm --filter api build
    startCommand: node --max-old-space-size=512 apps/api/dist/main.js
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    healthCheckPath: /v1/health
    autoDeploy: true